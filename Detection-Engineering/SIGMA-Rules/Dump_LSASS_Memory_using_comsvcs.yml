title: Dump LSASS.exe Memory using comsvcs.dll
id: fdc7ad5b-3b0f-44ee-b83b-5c9b4375b46b
status: stable
description: Detects the execution of rundll32.exe calling comsvcs.dll with MiniDump export function to dump LSASS process memory.
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://attack.mitre.org/techniques/T1003/
    - https://attack.mitre.org/tactics/TA0006/
    - https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/windows/credential_access_lsass_memdump_file_created
author: Saeed Elfiky
date: 2026-07-22
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    product: wondows
    category: process_creation
detection:
    selection:
        process.executable: "C:\\Windows\\System32\\rundll32.exe"
        process.parent.command_line: "*comsvcs.dll*"
        process.command_line: "*MiniDump*"
    condition: selection 
fields:
  - process.executable
  - file.path
  - process.command_line
  - process.parent.command_line
  - user.name
falsepositives:
    - Highly unlikely in standard environment
level: Critical