title: Scheduled Task Persistence via schtasks
id: 41c061ac-ae18-4f5f-86b1-1c63b16c55e2
status: test
description: Detects the creation or modification of Windows Scheduled Tasks using schtasks.exe, which may indicate persistence or privilege escalation.
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - https://learn.microsoft.com/en-us/windows/win32/taskschd/about-the-task-scheduler
author: Saeed Elfiky
date: 2026-07-18
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        process.executable|endswith: '\schtasks.exe'
    selection_cmd:
        process.command_line|contains:
        - '/create'
        - '/change'
    selection_suspicious:
        process.command_line|contains:
        - '/ru SYSTEM'
        - '/sc ONLOGON'
        - '/sc ONSTART'
        - '/rl HIGHEST'
    condition: selection_img and selection_cmd and selection_suspicious
fields:
  - process.executable
  - process.command_line
  - process.parent.name
  - user.name
falsepositives:
    - Legitimate administrative scheduled task creation
    - Enterprise software installers
    - Windows Update or system management tools
level: medium