title: Suspicious Process Execution from Writable Directories
id: 991540c7-e455-4076-8afe-437bbc118ba9
status: test
description: Detects executable files launched from user-writable directories such as Temp, ProgramData, Windows\Tasks, or Users\Public. Malware commonly executes payloads from these locations to evade application control and establish persistence.
references:
    - https://attack.mitre.org/techniques/T1204/002/
author: Saeed Elfiky
date: 2026-07-18
tags:
    - attack.execution
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_path:
        Image|contains:
            - '\AppData\Local\Temp\'
            - '\Windows\Tasks\'
            - '\Users\Public\'
            - '\Windows\Temp\'
            - '\ProgramData\'
            - '\$Recycle.Bin\'
    selection_ext:
        Image|endswith:
            - '.exe'
            - '.scr'
            - '.com'
            - '.pif'
            - '.cpl'
    filter_legitimate_installers:
        Image|contains:
            - '\AppData\Local\Temp\is-'
            - '\AppData\Local\Temp\7z'
            - '\AppData\Local\Temp\ns'
    filter_onedrive:
        Image|contains:
            - '\AppData\Local\Microsoft\OneDrive\'
    filter_legitimate_updaters:
        Image|endswith:
            - '\OneDriveSetup.exe'
            - '\TeamsSetup.exe'
            - '\GoogleUpdate.exe'
            - '\DropboxUpdate.exe'
    condition: selection_path and selection_ext and not 1 of filter_*
fields:
  - Image
  - CommandLine
  - ParentImage
  - ParentCommandLine
  - User
falsepositives:
    - Legitimate software installers or updates running from the user's Temp directory (e.g., Chrome, OneDrive updates).
    - Administrator-approved executables stored in writable directories
level: medium